version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nemologic-db
    environment:
      POSTGRES_DB: nemologic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nemologic"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    # Local dev ONLY: Expose port to host so local IDE/gradle can connect

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    container_name: nemologic-backend
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nemologic
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      AI_API_KEY: ${AI_API_KEY}
      COGNITO_JWK_SET_URI: https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_0an1GkWFm/.well-known/jwks.json
      SOLVE_PROOF_SECRET: ${SOLVE_PROOF_SECRET:-a-very-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-256}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nemologic-frontend
    read_only: true
    group_add:
      - root
    tmpfs:
      - /tmp
    ports:
      - "5173:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
